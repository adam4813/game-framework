name: 'Setup Engine Environment'
description: 'Install system dependencies, CMake, configure compiler, and setup vcpkg'

inputs:
  target:
    description: 'Target platform (Desktop or WebAssembly)'
    required: true
  em-version:
    description: 'Emscripten version'
    required: false
    default: '4.0.10'
  vcpkg-commit:
    description: 'vcpkg Git commit ID to use'
    required: false
    default: 'dd3097e305afa53f7b4312371f62058d2e665320'

runs:
  using: 'composite'
  steps:
    - name: Install CMake
      uses: lukka/get-cmake@latest

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          pkg-config \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          xvfb \
          xorg-dev

    - name: Setup Cpp
      if: inputs.target != 'WebAssembly'
      uses: aminya/setup-cpp@v1
      with:
        vcvarsall: ${{ runner.os == 'Windows' }}


    - name: Setup Emscripten
      if: inputs.target == 'WebAssembly'
      uses: emscripten-core/setup-emsdk@v16
      with:
        version: ${{ inputs.em-version }}

    - name: Restore artifacts, or run vcpkg, build and cache artifacts
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: ${{ inputs.vcpkg-commit }}
