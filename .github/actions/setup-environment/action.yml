name: 'Setup Engine Environment'
description: 'Install system dependencies, CMake, configure compiler, and setup vcpkg'

inputs:
  target:
    description: 'Target platform (Desktop or WebAssembly)'
    required: true
  em-version:
    description: 'Emscripten version'
    required: false
    default: '4.0.10'
  vcpkg-commit:
    description: "vcpkg Git commit ID override. Empty (default) uses vcpkg.json's builtin-baseline."
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install CMake
      uses: lukka/get-cmake@latest

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          pkg-config \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libltdl-dev \
          xvfb \
          xorg-dev

    - name: Setup Cpp
      if: inputs.target != 'WebAssembly'
      uses: aminya/setup-cpp@v1
      with:
        vcvarsall: ${{ runner.os == 'Windows' }}


    - name: Setup Emscripten
      if: inputs.target == 'WebAssembly'
      uses: emscripten-core/setup-emsdk@v16
      with:
        version: ${{ inputs.em-version }}

    - name: Resolve vcpkg commit
      id: vcpkg
      shell: bash
      run: |
        commit='${{ inputs.vcpkg-commit }}'
        if [ -z "$commit" ]; then
          commit=$(sed -n 's/.*"builtin-baseline"[[:space:]]*:[[:space:]]*"\([0-9a-f]\{40\}\)".*/\1/p' vcpkg.json)
        fi
        [ -n "$commit" ] || { echo "no vcpkg commit: set the input or builtin-baseline in vcpkg.json" >&2; exit 1; }
        echo "commit=$commit" >> "$GITHUB_OUTPUT"

    - name: Restore artifacts, or run vcpkg, build and cache artifacts
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: ${{ steps.vcpkg.outputs.commit }}
