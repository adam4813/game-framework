name: 'Changed targets'
description: >-
  Decide what this push or pull request has to build: the engine (src/, CMake, vcpkg, shared assets, CI
  setup), the engine tests (tests/) and which Game Targets. Docs-only changes build nothing; a game-only change
  builds and tests just that game; a tests-only change runs only the engine tests.
  Needs a checkout with full history (fetch-depth 0).

outputs:
  engine:
    description: "'true' when the engine must be built (implies tests)"
    value: ${{ steps.detect.outputs.engine }}
  tests:
    description: "'true' when the engine tests must be built and run"
    value: ${{ steps.detect.outputs.tests }}
  games:
    description: 'JSON array of the Game Targets to build and test (every game when the engine changed)'
    value: ${{ steps.detect.outputs.games }}

runs:
  using: 'composite'
  steps:
    - name: Detect changed targets
      id: detect
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.sha }}
      run: |
        script="${{ github.action_path }}/changed-targets.sh"
        case "$EVENT" in
          pull_request) bash "$script" "$PR_BASE" "$PR_HEAD" ;;
          # A new branch or a force push has no usable "before"; the script then builds everything.
          push) bash "$script" "$PUSH_BEFORE" "$PUSH_AFTER" ;;
          *) bash "$script" --all ;;
        esac
