name: Deploy WebAssembly to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build WASM and Deploy to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      EM-VERSION: '4.0.10'
      VCPKG-COMMIT: 'dd3097e305afa53f7b4312371f62058d2e665320'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Engine Environment
        uses: $/.github/actions/setup-environment
        with:
          em-version: ${{ env.EM-VERSION }}
          vcpkg-commit: ${{ env.VCPKG-COMMIT }}
          target: WebAssembly

      - name: Run CMake with Presets
        uses: lukka/run-cmake@v10
        with:
          configurePreset: wasm
          buildPreset: wasm-release

      # Setup Pages
      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Create deployment directory and copy WASM artifacts
      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          cp build/wasm/Release/game.html deploy/index.html
          cp build/wasm/Release/game.wasm deploy/
          cp build/wasm/Release/game.data deploy/
          cp build/wasm/Release/game.js deploy/
          echo "Game built and deployed" > deploy/README.txt

      # Upload artifact to Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './deploy'

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
