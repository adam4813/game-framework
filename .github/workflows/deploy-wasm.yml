name: Deploy WebAssembly to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deploys only when the Sandbox or the engine under it changed (see .github/actions/changed-targets).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.detect.outputs.games }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        uses: $/.github/actions/changed-targets

  build-and-deploy:
    name: Build WASM and Deploy to Pages
    needs: changes
    if: contains(fromJson(needs.changes.outputs.games), 'sandbox')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      EM-VERSION: '4.0.10'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Engine Environment
        uses: $/.github/actions/setup-environment
        with:
          em-version: ${{ env.EM-VERSION }}
          target: WebAssembly

      - name: Run CMake with Presets
        uses: lukka/run-cmake@v10
        with:
          configurePreset: wasm
          buildPreset: wasm-release

      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && env.VCPKG_ARCHIVES != '' }}
        uses: $/.github/actions/save-vcpkg-cache

      # Setup Pages
      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Create deployment directory and copy WASM artifacts
      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          cp build/wasm/games/sandbox/Release/sandbox.html deploy/index.html
          cp build/wasm/games/sandbox/Release/sandbox.wasm deploy/
          cp build/wasm/games/sandbox/Release/sandbox.data deploy/
          cp build/wasm/games/sandbox/Release/sandbox.js deploy/
          echo "Sandbox built and deployed" > deploy/README.txt

      # Upload artifact to Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './deploy'

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
