name: Build Game Engine

# The engine and its tests only. Game Targets, their tests and their artifacts belong to build-games.yml, so
# this workflow builds named targets rather than ALL (the root CMakeLists.txt adds every game to ALL). Local
# verify still builds ALL with desktop-test (AGENTS.md, "Build").

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  EM-VERSION: '4.0.10'

jobs:
  # Docs-only and game-only changes skip this workflow; a tests-only change runs the desktop tests but not the
  # WASM link (see .github/actions/changed-targets).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.detect.outputs.engine }}
      tests: ${{ steps.detect.outputs.tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        uses: $/.github/actions/changed-targets

  # Engine unit tests and the scene equivalence test: the `engine_tests` target and the `engine` CTest label.
  test:
    name: Build on ${{ matrix.os }} (Desktop)
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
        # MacOS builds - disabled as the non-large is ARM based, and doesnt' compile at this time
        # os: macos-latest-large

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Engine Environment
        uses: $/.github/actions/setup-environment
        with:
          em-version: ${{ env.EM-VERSION }}
          target: Desktop

      - name: Run CMake with Presets
        uses: lukka/run-cmake@v10
        with:
          configurePreset: desktop-test
          buildPreset: desktop-test-release
          buildPresetAdditionalArgs: "['--target', 'engine_tests']"
          testPreset: desktop-test-release
          testPresetAdditionalArgs: "['--output-on-failure', '-L', '^engine$']"

      # Configure is where vcpkg builds ports, so save them even when a later build or test fails.
      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && env.VCPKG_ARCHIVES != '' }}
        uses: $/.github/actions/save-vcpkg-cache

      # ctest ran it already; this run writes scene_test_output/ at the repo root for the summary and artifact.
      - name: Run Scene Equivalence Test
        shell: bash
        run: |
          TEST_EXE_PATH=$(find build/desktop-test/tests/scene_equivalence/Release -name "scene_equivalence_test*" -type f | head -1)
          if [ -z "$TEST_EXE_PATH" ]; then
            echo "scene_equivalence_test executable not found!"
            exit 1
          fi
          echo "Running test from: $TEST_EXE_PATH"
          # Fails on any mismatch not listed in kKnownMismatches (tests/scene_equivalence/main.cpp),
          # and on a listed one that now matches, so the list is cleaned up when its issue is fixed.
          set +e
          $TEST_EXE_PATH scene_test_output
          TEST_EXIT=$?
          set -e

          # Count rows by status from diff_table.txt
          # Format: | entity | JSON | AS | C++ | [MATCH] / [MISMATCH] / [KNOWN #issue] |
          if [ -f "scene_test_output/diff_table.txt" ]; then
            # Skip first 2 lines (header + separator), count non-empty data lines
            CHECKED_COMPONENTS=$(tail -n +3 scene_test_output/diff_table.txt | grep -c . || echo "0")
            echo "CHECKED_COMPONENTS=$CHECKED_COMPONENTS" >> $GITHUB_ENV
            MISMATCHES=$(tail -n +3 scene_test_output/diff_table.txt | awk -F'|' '$6 ~ /\[MISMATCH\]/ {count++} END {print count+0}')
            echo "MISMATCHES=$MISMATCHES" >> $GITHUB_ENV
            KNOWN=$(tail -n +3 scene_test_output/diff_table.txt | awk -F'|' '$6 ~ /\[KNOWN/ {count++} END {print count+0}')
            echo "KNOWN=$KNOWN" >> $GITHUB_ENV
          else
            echo "CHECKED_COMPONENTS=0" >> $GITHUB_ENV
            echo "MISMATCHES=0" >> $GITHUB_ENV
            echo "KNOWN=0" >> $GITHUB_ENV
          fi

          exit $TEST_EXIT

      - name: Generate Scene Equivalence Status
        if: always()
        shell: bash
        run: |
          echo "### 🔍 Scene Equivalence Test Results" >> $GITHUB_STEP_SUMMARY
          echo "* **Checked Components:** \`${{ env.CHECKED_COMPONENTS }}\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Component Mismatches:** \`${{ env.MISMATCHES }}\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Known Mismatches (open issues):** \`${{ env.KNOWN }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -f "scene_test_output/diff_table.txt" ]; then
            echo "* **Diff Table:** Available in artifacts" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Upload Scene Equivalence Test Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scene-equivalence-test-${{ matrix.os }}
          path: scene_test_output/
          if-no-files-found: warn

  # Full Emscripten link of the engine through tests/wasm_link (engine_wasm_link): the games' link flags and
  # the whole engine_lib archive. Link-only; build-games.yml builds and packages each game for the web.
  wasm-link:
    name: Build on ubuntu-latest (WebAssembly)
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Engine Environment
        uses: $/.github/actions/setup-environment
        with:
          em-version: ${{ env.EM-VERSION }}
          target: WebAssembly

      - name: Run CMake with Presets
        uses: lukka/run-cmake@v10
        with:
          configurePreset: wasm
          buildPreset: wasm-release
          buildPresetAdditionalArgs: "['--target', 'engine_wasm_link']"

      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && env.VCPKG_ARCHIVES != '' }}
        uses: $/.github/actions/save-vcpkg-cache
