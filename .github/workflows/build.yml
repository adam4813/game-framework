name: Build Game Engine

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    env:
      EM-VERSION: '4.0.10'
      VCPKG-COMMIT: 'dd3097e305afa53f7b4312371f62058d2e665320'

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows Release build
          - os: windows-latest
            target: Desktop
            preset_configure: desktop
            preset_build: desktop-release

          # Linux Release build
          - os: ubuntu-latest
            target: Desktop
            preset_configure: desktop
            preset_build: desktop-release

          # WebAssembly Release build
          - os: ubuntu-latest
            target: WebAssembly
            preset_configure: wasm
            preset_build: wasm-release

          # MacOS builds - disabled as the non-large is ARM based, and doesnt' compile at this time
          # - os: macos-latest-large
          #   target: Desktop
          #   preset_configure: desktop
          #   preset_build: desktop-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Engine Environment
        uses: $/.github/actions/setup-environment
        with:
          em-version: ${{ env.EM-VERSION }}
          vcpkg-commit: ${{ env.VCPKG-COMMIT }}
          target: ${{ matrix.target }}

      - name: Restore artifacts, or run vcpkg, build and cache artifacts
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG-COMMIT }}

      - name: Run CMake with Presets
        uses: lukka/run-cmake@v10
        with:
          configurePreset: ${{ matrix.preset_configure }}
          buildPreset: ${{ matrix.preset_build }}

      # Build and run scene equivalence test (desktop only)
      - name: Build Scene Equivalence Test
        if: matrix.target != 'WebAssembly'
        shell: bash
        run: cmake --build --preset ${{ matrix.preset_build }} --target scene_equivalence_test

      - name: Run Scene Equivalence Test
        if: matrix.target != 'WebAssembly'
        shell: bash
        run: |
          TEST_EXE_PATH=$(find build/${{ matrix.preset_configure }}/tests/scene_equivalence/Release -name "scene_equivalence_test*" -type f | head -1)
          if [ -z "$TEST_EXE_PATH" ]; then
            echo "scene_equivalence_test executable not found!"
            exit 1
          fi
          echo "Running test from: $TEST_EXE_PATH"
          $TEST_EXE_PATH scene_test_output
          
          # Count checked components and mismatches from diff_table.txt
          if [ -f "scene_test_output/diff_table.txt" ]; then
            # Skip first 2 lines (header + separator), count non-empty data lines
            CHECKED_COMPONENTS=$(tail -n +3 scene_test_output/diff_table.txt | grep -c . || echo "0")
            echo "CHECKED_COMPONENTS=$CHECKED_COMPONENTS" >> $GITHUB_ENV
            
            # Count lines where column 6 (status) does NOT contain [MATCH]
            # Format: | entity | JSON | AS | C++ | | [MATCH] |
            MISMATCHES=$(tail -n +3 scene_test_output/diff_table.txt | awk -F'|' '$6 !~ /MATCH/ && NF > 0 {count++} END {print count+0}')
            echo "MISMATCHES=$MISMATCHES" >> $GITHUB_ENV
          else
            echo "CHECKED_COMPONENTS=0" >> $GITHUB_ENV
            echo "MISMATCHES=0" >> $GITHUB_ENV
          fi
          
          exit 0  # Don't fail the workflow on test mismatches

      - name: Generate Scene Equivalence Status
        if: matrix.target != 'WebAssembly'
        shell: bash
        run: |
          echo "### 🔍 Scene Equivalence Test Results" >> $GITHUB_STEP_SUMMARY
          echo "* **Checked Components:** \`${{ env.CHECKED_COMPONENTS }}\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Component Mismatches:** \`${{ env.MISMATCHES }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -f "scene_test_output/diff_table.txt" ]; then
            echo "* **Diff Table:** Available in artifacts" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      # Verify build outputs for desktop builds
      - name: List desktop build outputs
        if: matrix.target != 'WebAssembly'
        shell: bash
        run: |
          echo "=== Build output directory ==="
          if [ -d "build/${{ matrix.preset_configure }}" ]; then
            find build/${{ matrix.preset_configure }} -type f \( -name "game*" -o -name "*.html" -o -name "*.wasm" \) | head -20
          fi

      # Upload test artifacts
      - name: Upload Scene Equivalence Test Artifacts
        if: matrix.target != 'WebAssembly' && always()
        uses: actions/upload-artifact@v7
        with:
          name: scene-equivalence-test-${{ matrix.os }}
          path: scene_test_output/
          if-no-files-found: warn

      # Upload artifacts for desktop builds
      - name: Upload Desktop Build Artifact
        if: matrix.target != 'WebAssembly'
        uses: actions/upload-artifact@v7
        with:
          name: game-${{ matrix.os }}-release
          path: build/${{ matrix.preset_configure }}/Release/game*
          if-no-files-found: warn
